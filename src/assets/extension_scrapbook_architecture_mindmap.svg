<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="960" height="480" rx="20" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#card-shadow)"/>
  
  <!-- Header Badge & Title -->
  <g transform="translate(36, 32)">
    <rect width="210" height="26" rx="13" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
    <text x="105" y="17" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EXTENSION ARCHITECTURE</text>
  </g>

  <!-- Root Node (Left Rounded Pill) -->
  <g transform="translate(36, 214)">
    <rect width="180" height="54" rx="27" fill="#1e293b" stroke="#818cf8" stroke-width="3.5"/>
    <text x="90" y="29" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">Lumen Shorts Saver</text>
  </g>

  <!-- Branch 1 (Indigo/Blue - 쇼츠 뷰 & 메타데이터) -->
  <path d="M 216 241 C 260 241, 265 115, 310 115" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sub-branch 1.1 -->
  <path d="M 525 115 C 555 115, 560 80, 595 80" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sub-branch 1.2 -->
  <path d="M 525 115 C 555 115, 560 150, 595 150" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 1 Node: 1단계 쇼츠 피드 -->
  <text x="315" y="120" fill="#c7d2fe" font-size="14" font-weight="700">1. 쇼츠 피드: 0초 메타 캡처</text>
  <!-- Level 2 Nodes -->
  <text x="605" y="85" fill="#60a5fa" font-size="13" font-weight="600">DOM 실시간 파싱 <tspan fill="#94a3b8" font-weight="400">→ 제목·조회수 무비용(0 Quota) 캡처</tspan></text>
  <text x="605" y="155" fill="#a5b4fc" font-size="13" font-weight="600">쇼츠 vs 일반 시청 이원화 <tspan fill="#94a3b8" font-weight="400">→ 0.1초 시크바 구간 반복 분석</tspan></text>

  <!-- Branch 2 (Emerald/Green - 채널 뷰 & 스크랩북) -->
  <path d="M 216 241 C 260 241, 270 241, 310 241" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sub-branch 2.1 -->
  <path d="M 525 241 C 555 241, 560 208, 595 208" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sub-branch 2.2 -->
  <path d="M 525 241 C 555 241, 560 274, 595 274" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 1 Node: 2단계 채널 뷰 -->
  <text x="315" y="246" fill="#a7f3d0" font-size="14" font-weight="700">2. 채널 뷰: 스마트 태그 스크랩북</text>
  <!-- Level 2 Nodes -->
  <text x="605" y="213" fill="#34d399" font-size="13" font-weight="600">URL 자동 감지 (/@handle) <tspan fill="#94a3b8" font-weight="400">→ 원클릭 채널 등록 인터페이스 전환</tspan></text>
  <text x="605" y="279" fill="#4ade80" font-size="13" font-weight="600">10+ 태그 아코디언 폴더 <tspan fill="#94a3b8" font-weight="400">→ 영드·애니·AI 등 카테고리 자산화</tspan></text>

  <!-- Branch 3 (Cyan/Sky - 로컬 퍼스트 & 동기화) -->
  <path d="M 216 241 C 260 241, 265 367, 310 367" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sub-branch 3.1 -->
  <path d="M 525 367 C 555 367, 560 334, 595 334" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sub-branch 3.2 -->
  <path d="M 525 367 C 555 367, 560 400, 595 400" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 1 Node: 3단계 로컬 퍼스트 -->
  <text x="315" y="372" fill="#bae6fd" font-size="14" font-weight="700">3. 로컬 퍼스트 &amp; 양방향 동기화</text>
  <!-- Level 2 Nodes -->
  <text x="605" y="339" fill="#38bdf8" font-size="13" font-weight="600">chrome.storage.local <tspan fill="#94a3b8" font-weight="400">→ 0.05초 초저지연 오프라인 우선 보존</tspan></text>
  <text x="605" y="405" fill="#93c5fd" font-size="13" font-weight="600">Two-way Sync 클라우드 연동 <tspan fill="#94a3b8" font-weight="400">→ 웹 대시보드 &amp; DB 실시간 양방향 동기화</tspan></text>

</svg>
